<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — PickupRadar</title>
  <meta name="description" content="That page is not on the PickupRadar website." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/assets/favicon-16.png" type="image/png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180" />
  <style>
    :root {
      --bg: #06111a;
      --card: #0d1c28;
      --text: #f4f8fb;
      --muted: #9fb2c4;
      --border: #193247;
      --blue: #b9d7ee;
      --green: #13db85;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #102638 0%, #06111a 55%, #03080d 100%);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      width: min(720px, 92%);
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    .brand {
      margin: 0 0 28px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand span { color: var(--green); }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 8vw, 48px);
      line-height: 1.05;
      letter-spacing: -1px;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 17px;
      max-width: 36em;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .links a {
      display: inline-block;
      text-decoration: none;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 800;
      font-size: 15px;
    }

    .links a:hover { color: var(--blue); }

    @media (max-width: 390px) {
      .wrap { padding: 32px 0 48px; }
      .brand { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="brand">Pickup<span>Radar</span></p>
    <h1>Page not found</h1>
    <p>That address is not on the PickupRadar website. These pages are.</p>
    <nav class="links" aria-label="Available pages">
      <a href="/index.html">Home</a>
      <a href="/app.html">Live preview</a>
      <a href="/support.html">Support</a>
    </nav>
  </main>
</body>
</html>
